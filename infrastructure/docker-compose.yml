services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mealwise}
      POSTGRES_USER: ${POSTGRES_USER:-mealwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infrastructure/.env}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mealwise}"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
  api:
    build: ../backend
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mealwise}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mealwise}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set in infrastructure/.env}
      SPRING_DATA_REDIS_HOST: redis
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
volumes: { pgdata: {}, redisdata: {} }
